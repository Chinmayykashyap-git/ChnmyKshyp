name: Refresh Live Coding & GitHub Stats

on:
  schedule:
    - cron: '0 */6 * * *' # Every 6 hours
  workflow_dispatch: # Manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch LeetCode (GraphQL), HackerRank (Best-Effort), and GitHub stats
        run: node scripts/fetch-stats.mjs

      - name: Commit and push updated stats.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/stats.json public/data/manual-stats.json
          if git diff --staged --quiet; then
            echo "No stat changes to commit."
          else
            git commit -m "chore(telemetry): update live LeetCode, HackerRank & GitHub stats [skip ci]"
            git push
          fi
